<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Configuración WiFi - Focus.Bot</title>
    <style>
        :root {
            --primary: #00a896;
            --background: #121212;
            --surface: #1e1e1e;
            --text: #ffffff;
            --text-secondary: #b3b3b3;
            --error: #cf6679;
        }
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }
        body {
            background-color: var(--background);
            color: var(--text);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            background-color: var(--surface);
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
            width: 100%;
            max-width: 400px;
            text-align: center;
        }
        .logo {
            font-size: 24px;
            font-weight: bold;
            color: var(--primary);
            margin-bottom: 10px;
            letter-spacing: 1px;
        }
        .subtitle {
            color: var(--text-secondary);
            font-size: 14px;
            margin-bottom: 25px;
        }
        .form-group {
            text-align: left;
            margin-bottom: 20px;
        }
        label {
            display: block;
            font-size: 14px;
            margin-bottom: 6px;
            color: var(--text-secondary);
        }
        input[type="text"], input[type="password"] {
            width: 100%;
            padding: 12px;
            background-color: #2c2c2c;
            border: 2px solid transparent;
            border-radius: 6px;
            color: var(--text);
            font-size: 16px;
            transition: border-color 0.3s ease;
        }
        input[type="text"]:focus, input[type="password"]:focus {
            outline: none;
            border-color: var(--primary);
        }
        button {
            width: 100%;
            padding: 14px;
            background-color: var(--primary);
            border: none;
            border-radius: 6px;
            color: var(--text);
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.3s ease, transform 0.1s ease;
            margin-top: 10px;
        }
        button:hover {
            background-color: #029484;
        }
        button:active {
            transform: scale(0.98);
        }
        .footer {
            margin-top: 25px;
            font-size: 12px;
            color: var(--text-secondary);
        }
    </style>
</head>
<body>

<div class="container">
    <div class="logo">Focus.Bot</div>
    <div class="subtitle">Configuración de la Red WiFi corporativa o doméstica</div>
    
    <form action="/save" method="POST">
        <div class="form-group">
            <label for="ssid">Nombre de la red (SSID)</label>
            <input type="text" id="ssid" name="ssid" placeholder="Ej. MiRedWiFi_2.4" required autocomplete="off">
        </div>
        
        <div class="form-group">
            <label for="password">Contraseña de la red</label>
            <input type="password" id="password" name="password" placeholder="••••••••" required>
        </div>
        
        <button type="submit">Conectar Dispositivo</button>
    </form>
    
    <div class="footer">
        Asegúrate de que la red opere en la banda de 2.4 GHz.
    </div>
</div>

</body>
</html>
